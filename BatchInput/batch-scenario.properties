# Random population
seed=20260811
rounds=500
# Load this fixed population. Remove this line to use random generation.
playersFile=players-input.csv
# Used only when playersFile is not set.
players=100

# Random player trait ranges
minBalance=100
maxBalance=1000
minMood=-0.25
maxMood=0.50
minYearStarted=2015
blacklistedPercent=2

# Relative probabilities for each generated player type
highRollerWeight=20
evenStevenWeight=50
lowRollerWeight=30

# Casino floor
blackjackTables=25
blackjackSeats=5
blackjackMinBet=5
blackjackMaxBet=2000

rouletteTables=25
rouletteSeats=6
rouletteMinBet=5
rouletteMaxBet=2000
# Categories paying more than 3-to-1 (Line/Corner/Street/Double/One-Odds) are
# capped lower than the table's regular maximum.
rouletteHighPayoutMaxBet=500

crapsTables=20
crapsSeats=8
crapsMinBet=5
crapsMaxBet=2000

pokerTables=25
pokerSeats=8
pokerMinBet=5
# No real maxbet: set far above any realistic balance so it never binds --
# actual per-hand contribution is still capped by player/opponent stack size.
pokerMaxBet=1000000000
pokerRakeRate=0.05
# No rake cap either -- the only poker constraint is the 5% rake rate.
pokerRakeCap=1000000000

slotMachines=200
slotBet=5
slotRtp=0.96

# Uniformly random among eligible tables instead of weighted by game
# preference, so voluntary table choice doesn't bias where players land.
tableAssignmentPolicy=RANDOM

# Casino removes a player once their profit reaches this amount.
# Use 0 to disable profit-based removal.
playerProfitLimit=1000

# Staff
securityStaff=2
floorManagers=2

# Written beside the BatchInput folder
outputDirectory=../BatchResults

# RL reallocation bridge (external Python process moves players between tables
# after each round). Disabled by default so existing batch runs are unaffected.
rlBridgeEnabled=false
rlStateDirectory=rl-exchange
rlPollIntervalMillis=50
rlTimeoutMillis=30000
