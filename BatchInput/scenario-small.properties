# Small, fast-iterating scenario for RL bridge debugging and smoke tests.
# Not for real profit comparisons -- see BatchInput/batch-scenario.properties
# for the full-size scenario used for real training/eval runs.
seed=42
rounds=20
players=20
minBalance=200
maxBalance=800
minMood=-0.25
maxMood=0.50
minYearStarted=2015
blacklistedPercent=0

highRollerWeight=20
evenStevenWeight=50
lowRollerWeight=30

blackjackTables=2
blackjackSeats=4
blackjackMinBet=10
blackjackMaxBet=100

rouletteTables=1
rouletteSeats=4
rouletteMinBet=5
rouletteMaxBet=100

crapsTables=1
crapsSeats=4
crapsMinBet=5
crapsMaxBet=100

pokerTables=1
pokerSeats=4
pokerMinBet=5
pokerMaxBet=100
pokerRakeRate=0.05
pokerRakeCap=100

slotMachines=2
slotBet=5
slotRtp=0.90

playerProfitLimit=0
securityStaff=1
floorManagers=1

outputDirectory=../BatchResults/small

# rlBridgeEnabled/rlStateDirectory are overridden automatically by
# rl/episode_driver.make_scenario_copy when this file is used for training
# or evaluation -- left disabled here so this file also works directly with
# a plain `java CasinoBatchRunner` run.
rlBridgeEnabled=false
rlStateDirectory=rl-exchange
rlPollIntervalMillis=50
rlTimeoutMillis=30000
