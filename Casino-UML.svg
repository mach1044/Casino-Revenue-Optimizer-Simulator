<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 10; }
      .abstract { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; rx: 10; }
      .controller { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.5; rx: 10; }
      .record { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.5; rx: 10; }
      .title { font: bold 30px Arial, sans-serif; fill: #0f172a; }
      .name { font: bold 19px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .stereo { font: italic 14px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .member { font: 14px Consolas, monospace; fill: #334155; }
      .label { font: 13px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .small { font: 13px Arial, sans-serif; fill: #334155; }
      .rule { stroke: #cbd5e1; stroke-width: 1; }
      .rel { fill: none; stroke: #475569; stroke-width: 2; }
      .dependency { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    </marker>
    <marker id="diamond" viewBox="0 0 14 10" refX="2" refY="5" markerWidth="12" markerHeight="10" orient="auto">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="#334155" stroke="#334155"/>
    </marker>
    <marker id="aggregate" viewBox="0 0 14 10" refX="2" refY="5" markerWidth="12" markerHeight="10" orient="auto">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="#f8fafc" stroke="#334155"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1120"/>
  <text class="title" x="800" y="42" text-anchor="middle">Casino Simulator — UML Class Diagram</text>

  <!-- Relationships are drawn first so class boxes remain readable. -->
  <path class="dependency" marker-end="url(#arrow)" d="M 800 150 L 800 205"/>
  <text class="label" x="868" y="182">creates / runs</text>

  <path class="rel" marker-start="url(#aggregate)" d="M 650 305 C 500 335, 330 350, 265 410"/>
  <text class="label" x="452" y="350">0..* players</text>
  <path class="rel" marker-start="url(#aggregate)" d="M 800 365 L 800 410"/>
  <text class="label" x="855" y="392">0..* games</text>
  <path class="rel" marker-start="url(#aggregate)" d="M 950 305 C 1100 335, 1270 350, 1335 410"/>
  <text class="label" x="1150" y="350">0..* staff</text>
  <path class="rel" marker-start="url(#aggregate)" d="M 690 365 C 630 520, 570 730, 530 900"/>
  <text class="label" x="592" y="720">0..* records</text>

  <!-- Inheritance -->
  <path class="rel" stroke="#2563eb" marker-end="url(#inherit)" d="M 90 750 L 90 715 C 90 685, 265 690, 265 650"/>
  <path class="rel" stroke="#2563eb" marker-end="url(#inherit)" d="M 265 750 L 265 650"/>
  <path class="rel" stroke="#2563eb" marker-end="url(#inherit)" d="M 440 750 L 440 715 C 440 685, 265 690, 265 650"/>

  <path class="rel" stroke="#2563eb" marker-end="url(#inherit)" d="M 620 750 L 620 715 C 620 685, 800 690, 800 650"/>
  <path class="rel" stroke="#2563eb" marker-end="url(#inherit)" d="M 800 750 L 800 650"/>
  <path class="rel" stroke="#2563eb" marker-end="url(#inherit)" d="M 980 750 L 980 715 C 980 685, 800 690, 800 650"/>

  <path class="rel" stroke="#2563eb" marker-end="url(#inherit)" d="M 1240 750 L 1240 700 C 1240 675, 1335 680, 1335 650"/>
  <path class="rel" stroke="#2563eb" marker-end="url(#inherit)" d="M 1430 750 L 1430 700 C 1430 675, 1335 680, 1335 650"/>

  <!-- Associations -->
  <path class="rel" marker-start="url(#diamond)" d="M 800 650 C 815 785, 980 845, 1030 900"/>
  <text class="label" x="926" y="826">1..* actions</text>
  <path class="rel" d="M 265 650 C 280 820, 390 830, 430 900"/>
  <text class="label" x="326" y="842">play history</text>
  <path class="rel" d="M 800 650 C 765 820, 610 830, 570 900"/>
  <text class="label" x="688" y="842">session history</text>
  <path class="dependency" marker-end="url(#arrow)" d="M 1240 815 C 1130 805, 1030 680, 960 610"/>
  <text class="label" x="1112" y="745">rigs game</text>
  <path class="dependency" marker-end="url(#arrow)" d="M 1430 815 C 1120 1000, 440 835, 390 650"/>
  <text class="label" x="1160" y="923">kicks / blacklists player</text>

  <!-- Controller -->
  <rect class="controller" x="650" y="70" width="300" height="80"/>
  <text class="name" x="800" y="102">CasinoRunner</text>
  <line class="rule" x1="650" y1="113" x2="950" y2="113"/>
  <text class="member" x="670" y="137">+ main(); runSimulation()</text>

  <!-- Casino -->
  <rect class="controller" x="600" y="205" width="400" height="160"/>
  <text class="name" x="800" y="237">Casino</text>
  <line class="rule" x1="600" y1="250" x2="1000" y2="250"/>
  <text class="member" x="620" y="275">- revenue</text>
  <text class="member" x="620" y="297">- players, staff, casinoFloor, playRecords</text>
  <line class="rule" x1="600" y1="310" x2="1000" y2="310"/>
  <text class="member" x="620" y="335">+ add / search / sort / save / load</text>
  <text class="member" x="620" y="357">+ blacklistPlayer(); kickPlayer(); rigOdds()</text>

  <!-- Abstract roots -->
  <rect class="abstract" x="90" y="410" width="350" height="240"/>
  <text class="stereo" x="265" y="435">«abstract»</text>
  <text class="name" x="265" y="460">Player</text>
  <line class="rule" x1="90" y1="473" x2="440" y2="473"/>
  <text class="member" x="110" y="498">- id, name</text>
  <text class="member" x="110" y="520">- balance, chipBalance, mood</text>
  <text class="member" x="110" y="542">- blacklisted, currentSession</text>
  <line class="rule" x1="90" y1="555" x2="440" y2="555"/>
  <text class="member" x="110" y="580">+ joinTable(); leaveTable()</text>
  <text class="member" x="110" y="602">+ buyChips(); betChips()</text>
  <text class="member" x="110" y="624">+ chooseGameAction()*</text>

  <rect class="abstract" x="625" y="410" width="350" height="240"/>
  <text class="stereo" x="800" y="435">«abstract»</text>
  <text class="name" x="800" y="460">Game</text>
  <line class="rule" x1="625" y1="473" x2="975" y2="473"/>
  <text class="member" x="645" y="498">- id, minBet, maxBet, profit</text>
  <text class="member" x="645" y="520"># currentTable : Player[]</text>
  <text class="member" x="645" y="542"># actions : Action[]</text>
  <line class="rule" x1="625" y1="555" x2="975" y2="555"/>
  <text class="member" x="645" y="580">+ addPlayer(); removePlayer()</text>
  <text class="member" x="645" y="602">+ collectBet(); distributeWinnings()</text>
  <text class="member" x="645" y="624">+ simulateRound()*</text>

  <rect class="abstract" x="1160" y="410" width="350" height="240"/>
  <text class="name" x="1335" y="450">Staff</text>
  <line class="rule" x1="1160" y1="463" x2="1510" y2="463"/>
  <text class="member" x="1180" y="490">- name</text>
  <text class="member" x="1180" y="514">- blacklistCount</text>
  <line class="rule" x1="1160" y1="530" x2="1510" y2="530"/>
  <text class="member" x="1180" y="557">+ blacklistPlayer(Player)</text>

  <!-- Concrete subclasses -->
  <rect class="box" x="15" y="750" width="150" height="65"/>
  <text class="name" x="90" y="789">HighRoller</text>
  <rect class="box" x="190" y="750" width="150" height="65"/>
  <text class="name" x="265" y="789">EvenSteven</text>
  <rect class="box" x="365" y="750" width="150" height="65"/>
  <text class="name" x="440" y="789">LowRoller</text>

  <rect class="box" x="540" y="750" width="160" height="65"/>
  <text class="name" x="620" y="789">Blackjack</text>
  <rect class="box" x="720" y="750" width="160" height="65"/>
  <text class="name" x="800" y="789">Roulette</text>
  <rect class="box" x="900" y="750" width="160" height="65"/>
  <text class="name" x="980" y="789">Slots</text>

  <rect class="box" x="1150" y="750" width="180" height="65"/>
  <text class="name" x="1240" y="789">FloorManager</text>
  <rect class="box" x="1340" y="750" width="180" height="65"/>
  <text class="name" x="1430" y="789">Security</text>

  <!-- Supporting domain classes -->
  <rect class="record" x="350" y="900" width="360" height="160"/>
  <text class="name" x="530" y="934">PlaySessionRecord</text>
  <line class="rule" x1="350" y1="947" x2="710" y2="947"/>
  <text class="member" x="370" y="974">- player : Player</text>
  <text class="member" x="370" y="997">- game : Game</text>
  <text class="member" x="370" y="1020">- winnings, wins, losses</text>
  <text class="member" x="370" y="1043">+ getWinRate()</text>

  <rect class="record" x="890" y="900" width="300" height="160"/>
  <text class="name" x="1040" y="934">Action</text>
  <line class="rule" x1="890" y1="947" x2="1190" y2="947"/>
  <text class="member" x="910" y="974">- id, name</text>
  <text class="member" x="910" y="997">- standardOdds</text>
  <text class="member" x="910" y="1020">- actualOdds</text>
  <text class="member" x="910" y="1043">- payoutRatio</text>

  <!-- Legend -->
  <text class="small" x="55" y="1092">Hollow triangle = inheritance</text>
  <text class="small" x="310" y="1092">◆ composition</text>
  <text class="small" x="440" y="1092">◇ aggregation</text>
  <text class="small" x="575" y="1092">Dashed arrow = dependency / uses</text>
</svg>
